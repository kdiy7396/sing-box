name: build-finch-1.14.4

on:
  push:
    branches: [finch-build]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout workflow branch (patch file)
        uses: actions/checkout@v4
        with:
          path: wf
      - name: Checkout v1.14.4 tag
        uses: actions/checkout@v4
        with:
          ref: v1.14.4
          path: src
      - name: Apply patch
        working-directory: src
        run: git apply ../wf/finch.patch
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Install musl + clang + lld
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools clang lld
      - name: Build
        working-directory: src
        env:
          CGO_ENABLED: '1'
          CC: 'clang --target=x86_64-linux-musl --sysroot=/usr/x86_64-linux-musl -fuse-ld=lld'
          CXX: 'clang++ --target=x86_64-linux-musl --sysroot=/usr/x86_64-linux-musl -fuse-ld=lld'
        run: |
          TAGS="with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale,with_ccm,with_ocm,with_cloudflared,with_naive_outbound,with_usbip,with_openvpn,with_openconnect,badlinkname,tfogo_checklinkname0,with_musl"
          go build -trimpath -ldflags "-X github.com/sagernet/sing-box/constant.Version=1.14.4-finch.2 -s -w -buildid=" -tags "$TAGS" -o sing-box-finch2 ./cmd/sing-box
          ./sing-box-finch2 version
          sha256sum sing-box-finch2
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-1.14.4-finch.2-linux-amd64-musl
          path: src/sing-box-finch2
      - name: Attach to release
        working-directory: src
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create finch-1.14.4-2 sing-box-finch2 --title "sing-box 1.14.4-finch.2 (urltest multi-sample)" --notes "Full-tag musl build of v1.14.4 + urltest multi-sample patch, built by GitHub Actions." || gh release upload finch-1.14.4-2 sing-box-finch2 --clobber
